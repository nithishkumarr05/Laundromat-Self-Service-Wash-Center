<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>404 | Page Not Found — FreshWash Laundromat</title>
 <link rel="icon" href="assests/fav.jpeg" type="image/jpeg">
    <meta name="description" content="Oops! The page you're looking for couldn't be found. Return to FreshWash for convenient, eco-friendly laundry services.">


    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'wash-primary': '#1A6B8A',
                        'wash-secondary': '#4ECDC4',
                        'wash-accent': '#FFE66D',
                        'wash-coral': '#FF6B6B',
                        'wash-warm': '#FFF8F0',
                        'wash-dark': '#1a1a1a',
                        'wash-light': '#F0F7FA',
                        'wash-mint': '#A8E6CF',
                        'wash-lavender': '#D4A5D4',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Prevent scrolling */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #F0F7FA;
            transition: background-color 0.3s;
        }
        .dark html, .dark body {
            background: #1a1a1a;
        }

        body {
            font-family: 'Inter', sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Background overlay with laundry theme */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=2070&auto=format');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.10;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(78,205,196,0.08) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(255,107,107,0.06) 0%, transparent 55%);
            z-index: 0;
            pointer-events: none;
        }
        .dark body::after {
            background: radial-gradient(circle at 30% 40%, rgba(78,205,196,0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(255,107,107,0.08) 0%, transparent 55%);
        }

        .error-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: clamp(20px, 4vh, 40px) clamp(16px, 4vw, 36px);
            text-align: center;
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(78, 205, 196, 0.25);
            transition: all 0.3s ease;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .error-card::-webkit-scrollbar {
            width: 3px;
        }
        .error-card::-webkit-scrollbar-thumb {
            background: #4ECDC4;
            border-radius: 10px;
        }
        .error-card {
            scrollbar-width: thin;
            scrollbar-color: #4ECDC4 transparent;
        }

        .dark .error-card {
            background: rgba(26, 26, 26, 0.96);
            border-color: rgba(78, 205, 196, 0.35);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatWash {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        @keyframes floatBubble {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.3; transform: scale(0.5); }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        @keyframes floatSoap {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
        }

        .animate-fade-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .float-wash {
            animation: floatWash 4s ease-in-out infinite;
        }

        .code-404 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(60px, 15vh, 120px);
            font-weight: 900;
            background: linear-gradient(135deg, #4ECDC4 0%, #1A6B8A 70%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            letter-spacing: -2px;
        }

        .dark .code-404 {
            background: linear-gradient(135deg, #4ECDC4 0%, #FFE66D 70%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .wash-icon {
            font-size: clamp(40px, 8vh, 60px);
            display: inline-block;
            animation: floatWash 3s ease-in-out infinite;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(20px, 4vh, 28px);
            font-weight: 700;
            color: #1a1a1a;
            margin-top: clamp(6px, 1.5vh, 14px);
            margin-bottom: clamp(6px, 1.5vh, 12px);
        }

        .dark .title {
            color: #ffffff;
        }

        .message {
            color: #4b5563;
            font-size: clamp(12px, 2vh, 15px);
            line-height: 1.6;
            max-width: 380px;
            margin: 0 auto clamp(12px, 3vh, 28px) auto;
        }

        .dark .message {
            color: #cbd5e1;
        }

        .button-group {
            display: flex;
            gap: clamp(8px, 2vw, 14px);
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: clamp(12px, 3vh, 28px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4ECDC4, #1A6B8A);
            color: #FFFFFF;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(78, 205, 196, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: #1A6B8A;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid #4ECDC4;
            transition: all 0.25s ease;
        }

        .btn-secondary:hover {
            background: #4ECDC4;
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        .dark .btn-secondary {
            color: #FFFFFF;
            border-color: #4ECDC4;
        }

        .dark .btn-secondary:hover {
            background: #4ECDC4;
            color: #1a1a1a;
        }

        .suggestion-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(8px, 2vw, 16px);
            margin-top: clamp(10px, 2vh, 18px);
            padding-top: clamp(10px, 2vh, 18px);
            border-top: 1px solid rgba(78, 205, 196, 0.2);
        }

        .suggestion-links a {
            color: #4ECDC4;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: color 0.2s;
        }

        .suggestion-links a:hover {
            color: #1A6B8A;
            text-decoration: underline;
        }

        .dark .suggestion-links a {
            color: #4ECDC4;
        }

        .dark .suggestion-links a:hover {
            color: #FFE66D;
            text-decoration: underline;
        }

        /* Floating elements */
        .floating-element {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }

        @keyframes floatBubbleAnim {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }
        .float-bubble {
            animation: floatBubbleAnim 5s ease-in-out infinite;
        }

        .brand-icon {
            font-family: 'Playfair Display', serif;
            font-size: clamp(14px, 3vh, 20px);
            font-weight: 700;
            margin-bottom: clamp(8px, 2vh, 16px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon i {
            font-size: 24px;
            color: #4ECDC4;
        }

        .brand-icon span:first-child {
            color: #4ECDC4;
        }

        .brand-icon span:last-child {
            color: #1A6B8A;
        }

        .dark .brand-icon span:last-child {
            color: #FFFFFF;
        }

        /* RTL Support */
        [dir="rtl"] .btn-primary i,
        [dir="rtl"] .btn-secondary i {
            transform: scaleX(-1);
        }

        /* Responsive */
        @media (max-width: 550px) {
            .btn-primary, .btn-secondary {
                padding: 10px 18px;
                font-size: 10px;
            }
            .suggestion-links a {
                font-size: 10px;
            }
        }

        @media (max-width: 400px) {
            .btn-primary, .btn-secondary {
                padding: 8px 14px;
                font-size: 9px;
            }
            .error-card {
                padding: 16px 12px;
            }
        }

        @media (max-height: 550px) {
            .wash-icon {
                display: none;
            }
            .message {
                display: none;
            }
        }

        .search-hint {
            margin-top: clamp(8px, 1.5vh, 16px);
            font-size: clamp(9px, 1.5vh, 11px);
            color: #9ca3af;
        }

        .dark .search-hint {
            color: #6b7280;
        }

        .search-hint a {
            color: #4ECDC4;
            text-decoration: none;
        }

        .search-hint a:hover {
            text-decoration: underline;
        }

        .top-controls {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            display: flex;
            gap: 12px;
        }
        .top-controls button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(78,205,196,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            transition: all 0.3s;
            cursor: pointer;
            font-size: 1rem;
        }
        .dark .top-controls button {
            background: rgba(30,30,30,0.6);
            color: #e5e5e5;
            border-color: rgba(78,205,196,0.2);
        }
        .top-controls button:hover {
            background: #4ECDC4;
            color: white;
            border-color: #4ECDC4;
        }
        .dark .top-controls button:hover {
            background: #4ECDC4;
            color: #1a1a1a;
        }
    </style>
</head>

<body>

    <!-- Top Controls (RTL / Theme) -->
    <div class="top-controls">
        <button id="rtl-toggle" title="Toggle RTL">
            <i class="fas fa-exchange-alt text-xs"></i>
        </button>
        <button id="theme-toggle" title="Toggle Theme">
            <i class="fas fa-moon text-sm"></i>
            <i class="fas fa-sun hidden text-sm"></i>
        </button>
    </div>

    <!-- Floating decorative elements -->
    <div class="floating-element float-bubble" style="left: 3%; top: 10%;"><i class="fas fa-soap"></i></div>
    <div class="floating-element float-bubble" style="right: 5%; top: 20%; animation-delay: 1.5s;"><i class="fas fa-water"></i></div>
    <div class="floating-element float-bubble" style="left: 8%; bottom: 15%; animation-delay: 3s;"><i class="fas fa-droplet"></i></div>
    <div class="floating-element float-bubble" style="right: 10%; bottom: 25%; animation-delay: 2s;"><i class="fas fa-wind"></i></div>
    <div class="floating-element float-bubble" style="left: 45%; top: 5%; animation-delay: 4s;"><i class="fas fa-spa"></i></div>
    <div class="floating-element float-bubble" style="right: 30%; bottom: 8%; animation-delay: 3.5s;"><i class="fas fa-recycle"></i></div>

    <div class="error-container">
        <div class="error-card animate-fade-up">
            <!-- Brand mark - Same as index.html -->
            <div class="flex justify-center mb-6 w-full">
                <a href="index.html" class="flex items-center gap-2 group">
                    <i class="fas fa-soap text-2xl text-wash-primary dark:text-white group-hover:scale-110 transition-transform"></i>
                    <span class="text-2xl font-serif font-bold text-wash-primary dark:text-white">FreshWash</span>
                </a>
            </div>

            <!-- Animated Laundry Icon (hidden on small/short screens to prevent scrolling) -->
            <div class="wash-icon hidden sm:block">
                🧺
            </div>

            <!-- 404 Code -->
            <div class="code-404 mb-2">
                404
            </div>

            <!-- Error Title -->
            <h1 class="title text-2xl md:text-3xl font-serif font-bold text-gray-900 dark:text-white mt-2 mb-4">
                Oops! This Page Got Lost in the Laundry
            </h1>

          
            <!-- Action Buttons -->
            <div class="button-group mb-6">
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="contact.html" class="btn-secondary">
                    <i class="fas fa-headset"></i> Contact Support
                </a>
            </div>

            <!-- Helpful Quick Links -->
            <div class="suggestion-links border-t border-gray-200/50 dark:border-gray-800/50 pt-4 mt-2">
                <a href="about.html">About Us</a>
                <a href="services.html">Our Services</a>
                <a href="wash-dry.html">Wash &amp; Dry</a>
                <a href="wash-plans.html">Wash Plans</a>
                <a href="self-service.html">Self-Service</a>
                <a href="pricing.html">Pricing</a>
            </div>

            <!-- Search hint -->
            <div class="search-hint mt-4 text-[10px]">
                <i class="fas fa-search"></i> Need help finding something? <a href="contact.html" class="text-wash-secondary hover:underline">Contact our support team</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle');
            const htmlTag = document.documentElement;

            function updateThemeIcons() {
                const isDark = htmlTag.classList.contains('dark');
                const sunIcon = document.querySelector('#theme-toggle .fa-sun');
                const moonIcon = document.querySelector('#theme-toggle .fa-moon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.classList.remove('hidden');
                        moonIcon.classList.add('hidden');
                    } else {
                        sunIcon.classList.add('hidden');
                        moonIcon.classList.remove('hidden');
                    }
                }
            }

            function toggleTheme() {
                if (htmlTag.classList.contains('dark')) {
                    htmlTag.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    htmlTag.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateThemeIcons();
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', toggleTheme);
            }

            // Initialize theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia(
                    'prefers-color-scheme: dark').matches)) {
                htmlTag.classList.add('dark');
            } else {
                htmlTag.classList.remove('dark');
            }
            updateThemeIcons();

            // RTL Toggle
            const rtlToggle = document.getElementById('rtl-toggle');

            function toggleRTL() {
                if (htmlTag.getAttribute('dir') === 'rtl') {
                    htmlTag.removeAttribute('dir');
                    localStorage.setItem('direction', 'ltr');
                } else {
                    htmlTag.setAttribute('dir', 'rtl');
                    localStorage.setItem('direction', 'rtl');
                }
            }

            if (rtlToggle) {
                rtlToggle.addEventListener('click', toggleRTL);
            }

            if (localStorage.getItem('direction') === 'rtl') {
                htmlTag.setAttribute('dir', 'rtl');
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.key === 'h' || e.key === 'H') {
                    window.location.href = 'index.html';
                }
                if (e.key === 'c' || e.key === 'C') {
                    window.location.href = 'contact.html';
                }
                if (e.key === 'a' || e.key === 'A') {
                    window.location.href = 'about.html';
                }
                if (e.key === 's' || e.key === 'S') {
                    window.location.href = 'services.html';
                }
            });

        })();
    </script>
</body>

</html>
